name: Release

# Build ready-to-import skill packages and publish them as a GitHub Release
# whenever a version tag (e.g. v1.1, v1.1.1) is pushed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # required to create the release and upload assets

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build skill packages
        # Same script users run locally — stages and zips dist/claude/ and
        # dist/quick/, each holding exactly one SKILL.md plus the shared
        # rules/ and templates/.
        run: |
          set -euo pipefail
          ./scripts/build-skill.sh both

      - name: Name release assets
        # Both zips contain a single top-level ai-plc-discovery/ folder.
        run: |
          set -euo pipefail
          mv dist/claude/ai-pds-claude-desktop.zip dist/
          mv dist/quick/ai-pds-quick-desktop.zip dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ai-pds-quick-desktop.zip
            dist/ai-pds-claude-desktop.zip
